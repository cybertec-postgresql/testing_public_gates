name: gates-testing-public

on:
  pull_request:

permissions:
  contents: read
  security-events: write
  issues: write
  pull-requests: write

jobs:
  # 1. SECRETS (Gitleaks)
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Scan the commits being added
        id: gitleaks
        continue-on-error: true
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE" ] \vert{}\vert{} [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            RANGE="$HEAD"
          else
            RANGE="$BASE..$HEAD"
          fi
          echo "scanning $RANGE"
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --log-opts="$RANGE" --redact --no-banner \
            --report-format sarif --report-path /repo/gitleaks.sarif --exit-code 1

      - name: Hand the SARIF to the scan step
        if: always() && hashFiles('gitleaks.sarif') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif
          retention-days: 7

      - name: Fail the check on findings
        if: steps.gitleaks.outcome == 'failure'
        run: |
          echo "::error::gitleaks found a committed secret. Rotate it, remove it and rewrite the branch."
          exit 1

  # 2. CVE SCANNING (Dependency Review - shows CVEs & CVSS in PR and blocks on High/8.0+)
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: always

  # 3. STATIC ANALYSIS & CVSS ENRICHMENT
  scan:
    runs-on: ubuntu-latest
    needs: [secret-scan]
    if: always()
    container:
      image: semgrep/semgrep:1.175.0
    steps:
      - name: Checkout target repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Checkout CRA CWE vectors from central repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: cybertec-postgresql/testing_public_gates
          ref: main
          path: _cra_config
          sparse-checkout: .cra

      - name: Fetch the secret scan report
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: gitleaks-sarif

      - name: Scan and emit SARIF
        env:
          SEMGREP_CONFIG: "p/default"
        run: |
          CONFIGS=""
          for c in $SEMGREP_CONFIG; do CONFIGS="$CONFIGS --config=$c"; done
          [ -d .semgrep ] && CONFIGS="$CONFIGS --config=.semgrep/"
          semgrep scan $CONFIGS --metrics=off --sarif -o semgrep.sarif .

      - name: Inject CVSS Records into SARIF & Create PR Summary
        id: cvss_gate
        run: |
          python3 - << 'EOF'
          import json, os, re

          # 1. Load CWE-to-CVSS mapping from .cra/cwe-vectors.json
          cwe_map = {}
          vec_path = "_cra_config/.cra/cwe-vectors.json"
          if os.path.exists(vec_path):
              with open(vec_path, "r") as f:
                  cwe_map = json.load(f)

          findings_table = []
          max_score = 0.0

          def enrich_sarif(filepath, default_cwe="CWE-798", is_secret=False):
              global max_score
              if not os.path.exists(filepath):
                  return
              with open(filepath, "r") as f:
                  data = json.load(f)

              for run in data.get("runs", []):
                  rules = {r["id"]: r for r in run.get("tool", {}).get("driver", {}).get("rules", [])}
                  
                  for rule_id, rule in rules.items():
                      props = rule.setdefault("properties", {})
                      tags = props.get("tags", [])
                      
                      # Extract CWE from tags
                      cwe = default_cwe if is_secret else None
                      for t in tags:
                          m = re.search(r"(CWE-\d+)", t, re.IGNORECASE)
                          if m:
                              cwe = m.group(1).upper()
                              break
                      
                      # Determine CVSS Score & Vector
                      score = None
                      vector = "N/A"
                      if cwe and cwe in cwe_map:
                          entry = cwe_map[cwe]
                          if isinstance(entry, dict):
                              score = float(entry.get("score", entry.get("baseScore", 0)))
                              vector = entry.get("vector", entry.get("vectorString", "CVSS:3.1/..."))
                          elif isinstance(entry, (int, float)):
                              score = float(entry)
