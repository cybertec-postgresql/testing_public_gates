name: gates-testing-public

on:
  pull_request:

permissions:
  contents: read
  security-events: write
  issues: write
  pull-requests: write

jobs:
  # 1. SECRETS (Gitleaks)
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Scan the commits being added
        id: gitleaks
        continue-on-error: true
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE" ] \vert{}\vert{} [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            RANGE="$HEAD"
          else
            RANGE="$BASE..$HEAD"
          fi
          echo "scanning $RANGE"
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --log-opts="$RANGE" --redact --no-banner \
            --report-format sarif --report-path /repo/gitleaks.sarif --exit-code 1

      - name: Hand the SARIF to the scan step
        if: always() && hashFiles('gitleaks.sarif') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif
          retention-days: 7

      - name: Fail the check on findings
        if: steps.gitleaks.outcome == 'failure'
        run: |
          echo "::error::gitleaks found a committed secret. Rotate it, remove it and rewrite the branch."
          exit 1

  # 2. CVE SCANNING (Dependency Review - zeigt CVEs & CVSS im PR und blockiert ab High/8.0)
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: always

  # 3. STATIC ANALYSIS & CVSS ENRICHMENT
  scan:
    runs-on: ubuntu-latest
    needs: [secret-scan]
    if: always()
    container:
      image: semgrep/semgrep:1.175.0
    steps:
      - name: Checkout target repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Checkout CRA CWE vectors from central repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: cybertec-postgresql/testing_public_gates
          ref: main
          path: _cra_config
          sparse-checkout: .cra

      - name: Fetch the secret scan report
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: gitleaks-sarif

      - name: Scan and emit SARIF
        env:
          SEMGREP_CONFIG: "p/default"
        run: |
          CONFIGS=""
          for c in $SEMGREP_CONFIG; do CONFIGS="$CONFIGS --config=$c"; done
          [ -d .semgrep ] && CONFIGS="$CONFIGS --config=.semgrep/"
          semgrep scan $CONFIGS --metrics=off --sarif -o semgrep.sarif .

      - name: Inject CVSS Records into SARIF & Create PR Summary
        id: cvss_gate
        run: |
          python3 - << 'EOF'
          import json, os, re

          # 1. Lade CWE-zu-CVSS Tabelle aus .cra/cwe-vectors.json
          cwe_map = {}
          vec_path = "_cra_config/.cra/cwe-vectors.json"
          if os.path.exists(vec_path):
              with open(vec_path, "r") as f:
                  cwe_map = json.load(f)

          findings_table = []
          max_score = 0.0

          def enrich_sarif(filepath, default_cwe="CWE-798", is_secret=False):
              global max_score
              if not os.path.exists(filepath):
                  return
              with open(filepath, "r") as f:
                  data = json.load(f)

              for run in data.get("runs", []):
                  rules = {r["id"]: r for r in run.get("tool", {}).get("driver", {}).get("rules", [])}
                  
                  for rule_id, rule in rules.items():
                      props = rule.setdefault("properties", {})
                      tags = props.get("tags", [])
                      
                      # Suche CWE in Tags
                      cwe = default_cwe if is_secret else None
                      for t in tags:
                          m = re.search(r"(CWE-\d+)", t, re.IGNORECASE)
                          if m:
                              cwe = m.group(1).upper()
                              break
                      
                      # Bestimme CVSS Score & Vector
                      score = None
                      vector = "N/A"
                      if cwe and cwe in cwe_map:
                          entry = cwe_map[cwe]
                          if isinstance(entry, dict):
                              score = float(entry.get("score", entry.get("baseScore", 0)))
                              vector = entry.get("vector", entry.get("vectorString", "CVSS:3.1/..."))
                          elif isinstance(entry, (int, float)):
                              score = float(entry)
                      
                      if not score:
                          if is_secret:
                              score, vector = 9.0, "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N (Secret)"
                          elif "security-severity" in props:
                              score = float(props["security-severity"])
                          else:
                              level = rule.get("defaultConfiguration", {}).get("level", "warning")
                              score = 8.5 if level == "error" else (5.5 if level == "warning" else 3.0)
                              vector = f"Default-Mapping ({level})"

                      # Schreibe CVSS-Score und Record direkt in das SARIF-Ticket!
                      props["security-severity"] = str(round(score, 1))
                      cwe_label = cwe if cwe else "CWE-Unknown"
                      
                      # Füge CVSS-Record sichtbar in die Ticket-Beschreibung ein
                      cvss_banner = f"\n\n---\n**CRA CVSS Record:**\n- **CVSS Score:** `{score:.1f} / 10.0`\n- **CWE:** `{cwe_label}`\n- **Vector:** `{vector}`\n"
                      if "fullDescription" in rule and "text" in rule["fullDescription"]:
                          rule["fullDescription"]["text"] += cvss_banner
                      elif "shortDescription" in rule and "text" in rule["shortDescription"]:
                          rule["shortDescription"]["text"] += cvss_banner

                      rule["_cra_meta"] = (cwe_label, score, vector)

                  # Prüfe alle konkreten Findings in diesem Lauf
                  for res in run.get("results", []):
                      r_id = res.get("ruleId", "unknown")
                      rule = rules.get(r_id, {})
                      cwe_label, score, vector = rule.get("_cra_meta", ("N/A", 5.0, "N/A"))
                      if score > max_score:
                          max_score = score
                      
                      loc = res.get("locations", [{}])[0].get("physicalLocation", {})
                      uri = loc.get("artifactLocation", {}).get("uri", "unknown")
                      line = loc.get("region", {}).get("startLine", 1)
                      
                      # Schreibe CVSS-Score auch direkt in die PR-Annotation
                      msg = res.get("message", {}).get("text", "")
                      res["message"]["text"] = f"[CVSS: {score:.1f} | {cwe_label} | {vector}] {msg}"
                      
                      status = "🔴 BLOCK (>= 8.0)" if score >= 8.0 else "🟡 INFO (< 8.0)"
                      findings_table.append(f"| `{uri}:{line}` | `{r_id}` | `{cwe_label}` | **{score:.1f}** | `{vector}` | {status} |")

              # Bereinige temporäre Hilfsfelder vor dem Upload
              for run in data.get("runs", []):
                  for r in run.get("tool", {}).get("driver", {}).get("rules", []):
                      r.pop("_cra_meta", None)

              with open(filepath, "w") as f:
                  json.dump(data, f, indent=2)

          enrich_sarif("gitleaks.sarif", default_cwe="CWE-798", is_secret=True)
          enrich_sarif("semgrep.sarif", default_cwe=None, is_secret=False)

          # Schreibe Markdown-Bericht für den PR und die Workflow-Summary
          with open("cvss_report.md", "w") as f:
              f.write("### 🛡️ CRA Security & CVSS Gate Report\n\n")
              if not findings_table:
                  f.write("✅ **Keine Sicherheitslücken gefunden (Max CVSS: 0.0).**\n")
              else:
                  f.write(f"**Höchster gemessener CVSS-Score:** `{max_score:.1f} / 10.0` (Blockade-Grenze: `8.0`)\n\n")
                  f.write("| Datei:Zeile | Regel | CWE | CVSS Score | CVSS Vector / Quelle | Gate Status |\n")
                  f.write("| :--- | :--- | :--- | :--- | :--- | :--- |\n")
                  for row in findings_table:
                      f.write(row + "\n")

          with open("max_score.txt", "w") as f:
              f.write(str(max_score))
          EOF
          cat cvss_report.md >> $GITHUB_STEP_SUMMARY

      - name: Post CVSS Record Table as PR Comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('cvss_report.md')) return;
            const body = fs.readFileSync('cvss_report.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number });
            const botComment = comments.data.find(c => c.body && c.body.includes('CRA Security & CVSS Gate Report'));
            if (botComment) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: botComment.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Upload Semgrep SARIF to code scanning
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@5ba2889ada762081db2c4f32a729827dce632c7b # v3
        with:
          sarif_file: semgrep.sarif

      - name: Upload Gitleaks SARIF to code scanning
        if: always() && hashFiles('gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@5ba2889ada762081db2c4f32a729827dce632c7b # v3
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

      - name: Remove temporary CRA config before final check
        if: always()
        run: rm -rf _cra_config

      - name: Block PR if CVSS >= 8.0
        if: always()
        run: |
          SCORE=$(cat max_score.txt)
          echo "Max detected CVSS Score is: $SCORE"
          python3 -c "import sys; s=float('$SCORE'); sys.exit(1 if s >= 8.0 else 0)" || {
            echo "::error::PR blockiert! Mindestens eine Schwachstelle hat einen CVSS-Score von >= 8.0 (Gemessen: $SCORE)."
            exit 1
          }
